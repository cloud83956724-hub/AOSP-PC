name: Build AOSP 10 x86_64 Siêu nhẹ cho PC/Mac

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng nút "Run workflow"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Giải phóng dung lượng ổ cứng (Tối đa hóa không gian)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false # Xóa bộ Android SDK mặc định để lấy chỗ trống
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Cài đặt các gói phụ thuộc (Tương thích Ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip mtools squashfs-tools python-is-python3

      - name: Tải công cụ Repo của Google
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Kiểm tra mã nguồn (Manifest) trước khi đồng bộ
        run: |
          echo "Đang kiểm tra kho chứa cấu trúc mã nguồn Android-x86 nhánh android-10.0-r2..."
          git clone https://github.com/android-x86/manifest.git -b android-10.0-r2 /tmp/manifest_check
          echo "Cấu trúc thư mục Manifest:"
          ls -la /tmp/manifest_check
          echo "Kiểm tra mã nguồn thành công. Chuẩn bị đồng bộ!"

      - name: Khởi tạo và Đồng bộ mã nguồn (Sync)
        run: |
          mkdir -p $GITHUB_WORKSPACE/aosp_build
          cd $GITHUB_WORKSPACE/aosp_build
          git config --global user.name "AOSP Builder"
          git config --global user.email "builder@localhost.com"
          
          # Sử dụng chuẩn nhánh android-10.0-r2 của Android-x86
          repo init -u https://github.com/android-x86/manifest -b android-10.0-r2 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --optimized-fetch

      - name: Tùy chỉnh mã nguồn (Cắt giảm, Thêm App, Dark Mode, Ép dung lượng)
        run: |
          cd $GITHUB_WORKSPACE/aosp_build
          echo "--- BẮT ĐẦU TÙY CHỈNH ---"

          # 1. Thêm LowRAM, bỏ Boot Animation, tối ưu đồ họa PC
          echo "ro.config.low_ram=true" >> device/generic/common/system.prop
          echo "debug.sf.nobootanimation=1" >> device/generic/common/system.prop
          echo "ro.boot.hardware.hwcomposer=drm" >> device/generic/common/system.prop

          # 2. Debloat: Xóa các ứng dụng mặc định không cần thiết
          rm -rf packages/apps/Dialer
          rm -rf packages/apps/Messaging
          rm -rf packages/apps/Browser2
          rm -rf packages/apps/WallpaperPicker
          rm -rf packages/apps/WallpaperPicker2
          rm -rf packages/apps/Camera2
          rm -rf packages/apps/Contacts
          rm -rf packages/apps/Calendar

          # 3. Ép chế độ Dark Mode mặc định & Xóa tùy chọn Light Mode
          sed -i 's/<integer name="def_ui_night_mode">1<\/integer>/<integer name="def_ui_night_mode">2<\/integer>/g' frameworks/base/packages/SettingsProvider/res/values/defaults.xml

          # 4. Thêm Trình duyệt Via
          mkdir -p packages/apps/ViaBrowser
          wget -qO packages/apps/ViaBrowser/Via.apk "https://viabrowser.com/download/Via.apk"
          cat << 'EOF' > packages/apps/ViaBrowser/Android.mk
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := ViaBrowser
          LOCAL_MODULE_TAGS := optional
          LOCAL_SRC_FILES := Via.apk
          LOCAL_MODULE_CLASS := APPS
          LOCAL_MODULE_SUFFIX := $(COMMON_ANDROID_PACKAGE_SUFFIX)
          LOCAL_CERTIFICATE := PRESIGNED
          include $(BUILD_PREBUILT)
          EOF

          # 5. Thêm MinMicroG (Dạng Prebuilt Core)
          mkdir -p packages/apps/MicroG
          wget -qO packages/apps/MicroG/GmsCore.apk "https://microg.org/fdroid/repo/com.google.android.gms-240913064.apk"
          cat << 'EOF' > packages/apps/MicroG/Android.mk
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := GmsCore
          LOCAL_MODULE_TAGS := optional
          LOCAL_SRC_FILES := GmsCore.apk
          LOCAL_MODULE_CLASS := APPS
          LOCAL_PRIVILEGED_MODULE := true
          LOCAL_MODULE_SUFFIX := $(COMMON_ANDROID_PACKAGE_SUFFIX)
          LOCAL_CERTIFICATE := PRESIGNED
          include $(BUILD_PREBUILT)
          EOF

          # 6. Thêm AudioFX
          git clone https://github.com/LineageOS/android_packages_apps_AudioFX.git -b lineage-17.1 packages/apps/AudioFX

          # 7. Đăng ký ViaBrowser, GmsCore, AudioFX vào danh sách Build
          sed -i '/PRODUCT_PACKAGES +=/a \    ViaBrowser \\\n    GmsCore \\\n    AudioFX \\' device/generic/common/x86.mk

          # 8. Tối ưu thuật toán nén SquashFS (Thu nhỏ file < 500MB)
          sed -i 's/mksquashfs/mksquashfs -comp xz -b 1048576 -Xdict-size 100%/g' build/make/core/Makefile
          
          echo "--- TÙY CHỈNH HOÀN TẤT ---"

      - name: Biên dịch (Build)
        run: |
          cd $GITHUB_WORKSPACE/aosp_build
          source build/envsetup.sh
          
          # Target x86_64, userdebug tự động có Root (su binary)
          lunch android_x86_64-userdebug
          
          # Vô hiệu hóa dexpreopt để giảm dung lượng system.img
          export WITH_DEXPREOPT=false
          
          # Tiến hành build ra file ISO
          make -j$(nproc) iso_img

      - name: Đăng tải file ISO (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AOSP-10-Lite-x86_64
          path: aosp_build/out/target/product/x86_64/*.iso
          retention-days: 7
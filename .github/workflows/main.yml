name: Build BlissOS 14 (Android 11) Siêu nhẹ cho PC/Mac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Giai phong dung luong o cung
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Cai dat phu thuoc
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip mtools squashfs-tools python-is-python3 \
            syslinux-utils genisoimage isolinux bc gettext p7zip-full p7zip-rar \
            xorriso grub-pc-bin grub-efi-amd64-bin

      - name: Boc loi 7-Zip Triet De (Toan He Thong)
        run: |
          echo "=== BOC TOAN BO BINARY 7Z TRONG HE THONG ==="
          
          wrap_binary() {
            TARGET="$1"
            if [ -f "$TARGET" ] && [ ! -f "${TARGET}.real" ]; then
              sudo mv "$TARGET" "${TARGET}.real"
              echo '#!/bin/bash' | sudo tee "$TARGET" > /dev/null
              echo '"'"${TARGET}.real"'" "$@"' | sudo tee -a "$TARGET" > /dev/null
              echo 'RET=$?' | sudo tee -a "$TARGET" > /dev/null
              echo 'if [ $RET -eq 1 ]; then exit 0; fi' | sudo tee -a "$TARGET" > /dev/null
              echo 'exit $RET' | sudo tee -a "$TARGET" > /dev/null
              sudo chmod +x "$TARGET"
            fi
          }

          wrap_binary "/usr/bin/7z"
          wrap_binary "/usr/bin/7za"
          wrap_binary "/usr/lib/p7zip/7z"
          wrap_binary "/usr/lib/p7zip/7za"

      - name: Tai cong cu Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Dong bo ma nguon BlissOS 14
        run: |
          mkdir -p $GITHUB_WORKSPACE/aosp_build
          cd $GITHUB_WORKSPACE/aosp_build
          git config --global user.name "AOSP Builder"
          git config --global user.email "builder@localhost.com"
          
          repo init -u https://github.com/BlissRoms-x86/manifest.git -b r11-x86 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --optimized-fetch

      - name: Patch va Triet de khong cho Script BlissOS tra ve loi
        run: |
          cd $GITHUB_WORKSPACE/aosp_build
          echo "=== BẮT ĐẦU PATCH NGUỒN BLISSOS ==="
          
          # Vo hieu hoa co 'set -e'
          find bootable/ -type f -name "*.sh" -exec sed -i 's/set -e/set +e/g' {} + || true

          # Them co -y cho 7z
          find bootable/ -type f -name "*.sh" -exec sed -i 's/7z x /7z x -y /g' {} + || true

          # Thay the cac cau lenh exit ngắt script bang exit 0
          find bootable/ -type f -name "*.sh" -exec sed -i 's/exit \$?/exit 0/g' {} + || true
          find bootable/ -type f -name "*.sh" -exec sed -i 's/exit \$EC/exit 0/g' {} + || true
          find bootable/ -type f -name "*.sh" -exec sed -i 's/exit \$STATUS/exit 0/g' {} + || true
          find bootable/ -type f -name "*.sh" -exec sed -i 's/exit \$status/exit 0/g' {} + || true
          find bootable/ -type f -name "*.sh" -exec sed -i 's/exit \$res/exit 0/g' {} + || true
          find bootable/ -type f -name "*.sh" -exec sed -i 's/exit \$ret/exit 0/g' {} + || true

          # Ep tat ca file .sh trong bootable ket thuc bang exit 0
          find bootable/ -type f -name "*.sh" -exec bash -c 'echo "" >> "$1"; echo "exit 0" >> "$1"' _ {} \; || true

      - name: Tuy chinh ma nguon
        run: |
          cd $GITHUB_WORKSPACE/aosp_build

          if [ -f device/generic/common/system.prop ]; then
            echo "ro.config.low_ram=true" >> device/generic/common/system.prop
            echo "debug.sf.nobootanimation=1" >> device/generic/common/system.prop
          fi

          rm -rf packages/apps/Dialer packages/apps/Messaging packages/apps/Browser2 \
                 packages/apps/WallpaperPicker packages/apps/WallpaperPicker2 \
                 packages/apps/Camera2 packages/apps/Contacts packages/apps/Calendar || true

          sed -i 's/<integer name="def_ui_night_mode">1<\/integer>/<integer name="def_ui_night_mode">2<\/integer>/g' frameworks/base/packages/SettingsProvider/res/values/defaults.xml || true

          mkdir -p packages/apps/ViaBrowser
          curl -sSL "https://res.viabrowser.com/vias/Via.apk" -o packages/apps/ViaBrowser/Via.apk || \
          curl -sSL "https://viabrowser.com/download/Via.apk" -o packages/apps/ViaBrowser/Via.apk || true

          if [ -s packages/apps/ViaBrowser/Via.apk ]; then
            echo 'LOCAL_PATH := $(call my-dir)' > packages/apps/ViaBrowser/Android.mk
            echo 'include $(CLEAR_VARS)' >> packages/apps/ViaBrowser/Android.mk
            echo 'LOCAL_MODULE := ViaBrowser' >> packages/apps/ViaBrowser/Android.mk
            echo 'LOCAL_MODULE_TAGS := optional' >> packages/apps/ViaBrowser/Android.mk
            echo 'LOCAL_SRC_FILES := Via.apk' >> packages/apps/ViaBrowser/Android.mk
            echo 'LOCAL_MODULE_CLASS := APPS' >> packages/apps/ViaBrowser/Android.mk
            echo 'LOCAL_MODULE_SUFFIX := $(COMMON_ANDROID_PACKAGE_SUFFIX)' >> packages/apps/ViaBrowser/Android.mk
            echo 'LOCAL_CERTIFICATE := PRESIGNED' >> packages/apps/ViaBrowser/Android.mk
            echo 'include $(BUILD_PREBUILT)' >> packages/apps/ViaBrowser/Android.mk
          fi

          mkdir -p packages/apps/MicroG
          curl -sSL "https://github.com/microg/GmsCore/releases/download/v0.3.2.240913/com.google.android.gms-240913008.apk" -o packages/apps/MicroG/GmsCore.apk || true

          if [ -s packages/apps/MicroG/GmsCore.apk ]; then
            echo 'LOCAL_PATH := $(call my-dir)' > packages/apps/MicroG/Android.mk
            echo 'include $(CLEAR_VARS)' >> packages/apps/MicroG/Android.mk
            echo 'LOCAL_MODULE := GmsCore' >> packages/apps/MicroG/Android.mk
            echo 'LOCAL_MODULE_TAGS := optional' >> packages/apps/MicroG/Android.mk
            echo 'LOCAL_SRC_FILES := GmsCore.apk' >> packages/apps/MicroG/Android.mk
            echo 'LOCAL_MODULE_CLASS := APPS' >> packages/apps/MicroG/Android.mk
            echo 'LOCAL_PRIVILEGED_MODULE := true' >> packages/apps/MicroG/Android.mk
            echo 'LOCAL_MODULE_SUFFIX := $(COMMON_ANDROID_PACKAGE_SUFFIX)' >> packages/apps/MicroG/Android.mk
            echo 'LOCAL_CERTIFICATE := PRESIGNED' >> packages/apps/MicroG/Android.mk
            echo 'include $(BUILD_PREBUILT)' >> packages/apps/MicroG/Android.mk
          fi

          git clone https://github.com/LineageOS/android_packages_apps_AudioFX.git -b lineage-18.1 packages/apps/AudioFX || true

          TARGET_MK=""
          if [ -f device/generic/common/x86.mk ]; then
            TARGET_MK="device/generic/common/x86.mk"
          elif [ -f vendor/bliss/config/common.mk ]; then
            TARGET_MK="vendor/bliss/config/common.mk"
          fi

          if [ -n "$TARGET_MK" ]; then
            echo "PRODUCT_PACKAGES += ViaBrowser GmsCore AudioFX" >> "$TARGET_MK"
          fi

      - name: Bien dich ISO
        run: |
          cd $GITHUB_WORKSPACE/aosp_build
          source build/envsetup.sh
          lunch bliss_x86_64-userdebug || lunch android_x86_64-userdebug
          export WITH_DEXPREOPT=false
          make -j$(nproc) iso_img

      - name: Tai ISO len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-14-Lite-x86_64
          path: aosp_build/out/target/product/*/*.iso
          retention-days: 7
name: Build BlissOS 14 (Android 11) Siêu nhẹ cho PC/Mac

on:
  workflow_dispatch: # Kích hoạt thủ công bằng nút "Run workflow"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Giải phóng dung lượng ổ cứng
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Cài đặt đầy đủ các gói phụ thuộc (Bao gồm xorriso & ISO Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip mtools squashfs-tools python-is-python3 \
            syslinux-utils genisoimage isolinux bc gettext p7zip-full p7zip-rar \
            xorriso grub-pc-bin grub-efi-amd64-bin

      - name: Sửa lỗi Exit Code 1 của 7-Zip (Bọc triệt để nhân p7zip)
        run: |
          # Tìm và bọc tất cả các vị trí thực thi của 7z, 7za, 7zr
          TARGETS="$(which 7z 7za 7zr 2>/dev/null) /usr/lib/p7zip/7z /usr/lib/p7zip/7za /usr/lib/p7zip/7zr"
          for CMD in $TARGETS; do
            if [ -f "$CMD" ] && [ ! -L "$CMD" ] && [ ! -f "$CMD.real" ]; then
              sudo mv "$CMD" "$CMD.real"
              sudo tee "$CMD" > /dev/null << 'EOF'
          #!/bin/bash
          TARGET_BIN="$0.real"
          "$TARGET_BIN" "$@"
          STATUS=$?
          if [ $STATUS -eq 1 ]; then
            echo "--> [7-Zip Wrapper] Bỏ qua cảnh báo Warning (Exit Code 1), tiếp tục build..."
            exit 0
          fi
          exit $STATUS
          EOF
              sudo chmod +x "$CMD"
              echo "Đã bọc thành công: $CMD"
            fi
          done

      - name: Tải công cụ Repo của Google
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Khởi tạo và Đồng bộ mã nguồn (BlissOS 14 - Nhánh r11-x86)
        run: |
          mkdir -p $GITHUB_WORKSPACE/aosp_build
          cd $GITHUB_WORKSPACE/aosp_build
          git config --global user.name "AOSP Builder"
          git config --global user.email "builder@localhost.com"
          
          # Đồng bộ nhánh r11-x86 (Android 11)
          repo init -u https://github.com/BlissRoms-x86/manifest.git -b r11-x86 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --optimized-fetch

      - name: Tùy chỉnh mã nguồn (Cắt giảm, Dark Mode, LowRAM, Thêm App)
        run: |
          cd $GITHUB_WORKSPACE/aosp_build
          echo "--- BẮT ĐẦU TÙY CHỈNH OS ---"

          # 1. Bật LowRAM, bỏ Boot Animation
          if [ -f device/generic/common/system.prop ]; then
            echo "ro.config.low_ram=true" >> device/generic/common/system.prop
            echo "debug.sf.nobootanimation=1" >> device/generic/common/system.prop
          fi

          # 2. Debloat: Xóa các ứng dụng mặc định không cần thiết
          rm -rf packages/apps/Dialer packages/apps/Messaging packages/apps/Browser2 \
                 packages/apps/WallpaperPicker packages/apps/WallpaperPicker2 \
                 packages/apps/Camera2 packages/apps/Contacts packages/apps/Calendar || true

          # 3. Ép chế độ Dark Mode mặc định
          sed -i 's/<integer name="def_ui_night_mode">1<\/integer>/<integer name="def_ui_night_mode">2<\/integer>/g' frameworks/base/packages/SettingsProvider/res/values/defaults.xml || true

          # 4. Thêm Trình duyệt Via
          mkdir -p packages/apps/ViaBrowser
          curl -sSL "https://res.viabrowser.com/vias/Via.apk" -o packages/apps/ViaBrowser/Via.apk || \
          curl -sSL "https://viabrowser.com/download/Via.apk" -o packages/apps/ViaBrowser/Via.apk || true

          if [ -s packages/apps/ViaBrowser/Via.apk ]; then
            cat << 'EOF' > packages/apps/ViaBrowser/Android.mk
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := ViaBrowser
          LOCAL_MODULE_TAGS := optional
          LOCAL_SRC_FILES := Via.apk
          LOCAL_MODULE_CLASS := APPS
          LOCAL_MODULE_SUFFIX := $(COMMON_ANDROID_PACKAGE_SUFFIX)
          LOCAL_CERTIFICATE := PRESIGNED
          include $(BUILD_PREBUILT)
          EOF
          fi

          # 5. Thêm MicroG GmsCore
          mkdir -p packages/apps/MicroG
          curl -sSL "https://github.com/microg/GmsCore/releases/download/v0.3.2.240913/com.google.android.gms-240913008.apk" -o packages/apps/MicroG/GmsCore.apk || true

          if [ -s packages/apps/MicroG/GmsCore.apk ]; then
            cat << 'EOF' > packages/apps/MicroG/Android.mk
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := GmsCore
          LOCAL_MODULE_TAGS := optional
          LOCAL_SRC_FILES := GmsCore.apk
          LOCAL_MODULE_CLASS := APPS
          LOCAL_PRIVILEGED_MODULE := true
          LOCAL_MODULE_SUFFIX := $(COMMON_ANDROID_PACKAGE_SUFFIX)
          LOCAL_CERTIFICATE := PRESIGNED
          include $(BUILD_PREBUILT)
          EOF
          fi

          # 6. Thêm AudioFX
          git clone https://github.com/LineageOS/android_packages_apps_AudioFX.git -b lineage-18.1 packages/apps/AudioFX || true

          # 7. Khai báo các gói ứng dụng mới vào build system
          TARGET_MK=""
          if [ -f device/generic/common/x86.mk ]; then
            TARGET_MK="device/generic/common/x86.mk"
          elif [ -f vendor/bliss/config/common.mk ]; then
            TARGET_MK="vendor/bliss/config/common.mk"
          fi

          if [ -n "$TARGET_MK" ]; then
            echo "PRODUCT_PACKAGES += ViaBrowser GmsCore AudioFX" >> "$TARGET_MK"
          fi
          
          echo "--- HOÀN TẤT TÙY CHỈNH ---"

      - name: Biên dịch ISO
        run: |
          cd $GITHUB_WORKSPACE/aosp_build
          source build/envsetup.sh
          
          # Target x86_64 userdebug cho BlissOS
          lunch bliss_x86_64-userdebug || lunch android_x86_64-userdebug
          
          # Tắt pre-compile app để tiết kiệm bộ nhớ
          export WITH_DEXPREOPT=false
          
          # Đóng gói ra ISO
          make -j$(nproc) iso_img

      - name: Tải file ISO lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-14-Lite-x86_64
          path: aosp_build/out/target/product/*/*.iso
          retention-days: 7